steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/uk-income-calculator-git:$COMMIT_SHA
      - .
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/uk-income-calculator-git:$COMMIT_SHA
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - uk-income-calculator-git
      - --image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/uk-income-calculator-git:$COMMIT_SHA
      - --region=europe-west1
      - --platform=managed
      - --allow-unauthenticated
      - --quiet
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/uk-income-calculator-git:$COMMIT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
